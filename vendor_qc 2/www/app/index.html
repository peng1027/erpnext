{% extends "templates/web.html" %}
{% block title %}Vendor QC · App{% endblock %}
{% block page_content %}
<style>
  body{background:linear-gradient(180deg,#0B1220 0%, #0A0F1A 100%); color:#E5E7EB}
  .container{max-width:1024px;margin:0 auto;padding:18px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .logo{width:28px;height:28px;border-radius:8px;background:radial-gradient(120% 120% at 20% 20%, #A78BFA 0%, #7C3AED 40%, #0EA5E9 80%)}
  .btn{border:none;border-radius:12px;padding:10px 14px;background:linear-gradient(180deg,#7C3AED,#5B21B6);color:#fff;cursor:pointer}
  .ghost{background:transparent;border:1px solid #334155}
  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
  .card{background:linear-gradient(180deg, rgba(31,41,55,.6), rgba(17,24,39,.9));border:1px solid #334155;border-radius:14px;padding:14px}
  .kpi{font-size:28px;font-weight:800}
  .chip{display:inline-flex;gap:6px;align-items:center;border:1px solid #334155;border-radius:999px;padding:6px 10px;background:rgba(14,165,233,.12);color:#93C5FD}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;justify-content:space-between;align-items:center;border:1px solid #334155;border-radius:12px;padding:12px 14px;background:rgba(2,6,23,.35)}
  .meta{display:flex;flex-direction:column;gap:4px}
  .tabbar{position:sticky;bottom:0;display:flex;gap:10px;padding:8px;background:rgba(16,24,40,.8);backdrop-filter:blur(10px);border-top:1px solid #334155}
  .tab{flex:1;text-align:center;color:#9CA3AF;padding:8px;border-radius:12px;cursor:pointer}
  .tab.active{color:#fff;background:rgba(124,58,237,.2);border:1px solid #5B21B6}
  input,select,textarea{background:rgba(2,6,23,.55);border:1px solid #334155;color:#E5E7EB;border-radius:12px;padding:10px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
</style>
<div class="container" id="app">
  <div class="top">
    <div style="display:flex;gap:8px;align-items:center">
      <div class="logo"></div>
      <strong>Vendor QC</strong>
      <span id="whoami" style="color:#9CA3AF"></span>
    </div>
    <div>
      <select id="lang" style="background:transparent;border:1px solid #334155;color:#E5E7EB;border-radius:10px;padding:8px">
        <option value="zh-Hant">繁體中文</option>
        <option value="en">English</option>
      </select>
      <button class="btn ghost" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="kpi" id="kpi-open">--</div>
      <div>Open NCRs</div>
    </div>
    <div class="card">
      <div class="kpi" id="kpi-overdue">--</div>
      <div>Overdue</div>
    </div>
    <div class="card">
      <div class="kpi" id="kpi-visits">--</div>
      <div>Visits Today</div>
    </div>
  </div>

  <div class="cards" style="grid-template-columns:1.2fr .8fr">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>New Inspection</strong>
        <button class="btn ghost" onclick="createInspection()">Submit</button>
      </div>
      <div class="field">
        <label>Site</label>
        <select id="site"></select>
      </div>
      <div class="field">
        <label>Supplier</label>
        <input id="supplier" placeholder="Supplier"/>
      </div>
      <div class="field">
        <label>Remarks</label>
        <textarea id="remarks" rows="3" placeholder="Notes..."></textarea>
      </div>
    </div>
    <div class="card">
      <strong>NCR</strong>
      <div class="list" id="ncr-list"></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab active">Home</div>
    <div class="tab">Sites</div>
    <div class="tab">Inspection</div>
    <div class="tab">NCR</div>
    <div class="tab">Me</div>
  </div>
</div>

<script>
async function call(method, args={{}}){
  const r = await fetch('/api/method/' + method, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Frappe-CSRF-Token': '{{ csrf_token }}' },
    body: JSON.stringify(args||{})
  });
  const j = await r.json();
  if(!j.message && j.exc) { throw new Error(j.exc); }
  return j.message;
}
async function init(){
  const langSel = document.getElementById('lang');
  const pref = localStorage.getItem('lang') || (navigator.language.startsWith('zh')?'zh-Hant':'en');
  langSel.value = pref; langSel.addEventListener('change', e=>localStorage.setItem('lang', e.target.value));
  const d = await call('vendor_qc.api.dashboard');
  document.getElementById('kpi-open').textContent = d.open_ncr;
  document.getElementById('kpi-overdue').textContent = d.overdue;
  document.getElementById('kpi-visits').textContent = d.visits_today;
  const sites = await call('vendor_qc.api.list_sites');
  const siteSel = document.getElementById('site');
  sites.forEach(s=>{
    const opt = document.createElement('option'); opt.value = s.name; opt.textContent = s.site_name + ' · ' + (s.project||'');
    siteSel.appendChild(opt);
  });
  const ncrs = await call('vendor_qc.api.list_ncrs');
  const list = document.getElementById('ncr-list'); list.innerHTML='';
  ncrs.forEach(n=>{
    const row = document.createElement('div'); row.className='row';
    row.innerHTML = `<div class="meta"><div><strong>${n.name}</strong> · ${n.title}</div>
      <div style="color:#9CA3AF">${n.site} · ${n.supplier} · ${n.status}</div></div>
      <button class="btn ghost" onclick="reply('${n.name}')">Reply</button>`;
    list.appendChild(row);
  });
  document.getElementById('whoami').textContent = '{{ frappe.session.user }}';
}
async function createInspection(){
  const site = document.getElementById('site').value;
  const supplier = document.getElementById('supplier').value;
  const remarks = document.getElementById('remarks').value;
  const r = await call('vendor_qc.api.create_inspection', {site, supplier, remarks});
  alert('Created Quality Inspection: ' + r.quality_inspection);
}
async function reply(ncr){
  const msg = prompt('CAPA reply:');
  if(!msg) return;
  await call('vendor_qc.api.supplier_reply', {ncr, message: msg});
  alert('Submitted.');
}
function logout(){ window.location.href='/'; }
init();
</script>
{% endblock %}
